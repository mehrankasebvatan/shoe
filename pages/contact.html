<!doctype html>
<html lang="en">
  <head>
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONTACT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html" id="logo">SNEAKER</a>
        <div class="nav-link-container">
          <a href="../index.html" class="nav-link">SHOP</a>
          <a href="./about.html" class="nav-link">ABOUT</a>
          <a href="./contact.html" class="nav-link">CONTACT</a>
        </div>
        <a href="">
          <img id="cart" src="../img/shopping-bag.png" alt="cart" />
        </a>
      </nav>
    </header>

    <main>
      <section class="contact-container">
        <div class="left-contact-container">
          <h1 class="contact-header">GET IN TOUCH</h1>
          <p class="info-text">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Dicta
            facilis deserunt aliquam totam qui error. Eius laboriosam dicta,
            quas eveniet pariatur.
          </p>
          <div class="contact-card-container">
            <div class="contact-card">
              <img class="contant-icon" src="../img/email.png" alt="" />
              <div>
                <p class="bold">Email</p>
                <p>admin@mail.com</p>
              </div>
            </div>

            <div class="contact-card">
              <img class="contant-icon" src="../img/phone-call.png" alt="" />
              <div>
                <p class="bold">Phone</p>
                <p>0912 3456789</p>
              </div>
            </div>

            <div class="contact-card">
              <img
                class="contant-icon"
                src="../img/gps-navigation.png"
                alt=""
              />
              <div>
                <p class="bold">Address</p>
                <p>Tehran, Iran</p>
              </div>
            </div>
          </div>
        </div>
        <div class="right-contact-container">
          <form action="" method="post">
            <label class="contact-label" for="name">Name</label>
            <input
              class="contact-input"
              type="text"
              name="name"
              id="name"
              placeholder="FullName"
            />

            <label class="contact-label" for="email">Email</label>
            <input
              class="contact-input"
              type="email"
              name="email"
              id="email"
              placeholder="Email"
            />

            <label class="contact-label" for="message">Message</label>
            <textarea
              class="contact-textarea"
              name="message"
              id="message"
              placeholder="Write your message ..."
            >
            </textarea>

            <button type="submit" class="dark-btn-green">Send Message</button>
          </form>
        </div>
      </section>
    </main>
    <footer>
      <a href="https://facebook.com">
        <img src="../img/facebook.png" alt="" />
      </a>
      <a href="https://instagram.com">
        <img src="../img/instagram.png" alt="" />
      </a>
      <a href="https://youtube.com">
        <img src="../img/youtube.png" alt="" />
      </a>
    </footer>
  </body>
</html>
